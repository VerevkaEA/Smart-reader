<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart-reader</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.10.111/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.10.111/pdf.worker.min.js"></script>

    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.10.111/pdf.worker.min.js";
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/idb-keyval/6.2.1/idb-keyval.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.min.js"></script>
  </head>
  <body>
    <header>
      <h1>Smart-reader</h1>
      <button id="game-btn">Мой словарь</button>
    </header>
    <main>
      <section id="library-screen">
        <h2>Мои книги</h2>
        <div class="upload-container">
          <label for="file-input">+ Добавить книгу (PDF/FB2)</label>
          <input type="file" id="file-input" accept=".pdf, .fb2" />
        </div>
        <div id="books-grid">
          <div class="book-card">
            <div class="book-cover"></div>
            <h3 class="book-title">Harry Potter</h3>
            <div class="progress-container">
              <div class="progress-bar"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="reader-screen" class="hidden">
        <div class="reader-header">
          <button id="back-to-library-btn">< В библиотеку</button>
          <h3 id="reader-book-title">Название книги</h3>
        </div>
        <div class="reader-container">
          <button class="nav-btn" id="prev-page-btn"><</button>
          <div id="book-text-content"></div>
          <button class="nav-btn" id="next-page-btn">></button>
          <p id="page-counter">Страница: 0/0</p>
        </div>
      </section>
      <div id="dict-modal" class="modal hidden">
        <button id="close-modal-btn">✕</button>
       
        <div class="audio-block">
           <h2 id="modal-word">book</h2>
         
          <button id="play-audio-btn">🔊</button>
        </div>
        <p id="modal-translation">книга</p>
        <p id="modal-definition">это бумага, где написаны фразы</p>
        <button id="add-to-vocab-btn">⭐Добавить в словарь</button>
      </div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
